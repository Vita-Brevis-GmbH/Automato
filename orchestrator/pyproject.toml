[project]
name = "orchestrator"
version = "0.117.0"
description = "Automato Orchestrator - API, Jobs, Audit-Log, Rule & Service Store"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121",  # Depends(scope="function"): Commit vor der Antwort
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "celery[redis]>=5.4",
    "pyjwt[crypto]>=2.9",
    "cryptography>=42",  # Fernet fuer optionale Audit-Payload-Verschluesselung (E1.4)
    "sot-gateway",
]

[project.scripts]
automato = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "httpx2>=2.16",  # TestClient von Starlette (0.109.1: httpx dort veraltet)
    "pytest-xdist>=3.6",  # Tests parallel: pytest -n auto (docs/TESTS.md)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
