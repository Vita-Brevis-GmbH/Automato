# CI - selektiv pro Komponente (Vorgabe aus ADR 0001).
# Secret-Scan laeuft immer; Python-/Frontend-Jobs nur bei Aenderungen im Pfad.
name: ci

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'orchestrator/**'
              - 'collectors/**'
              - 'sot-gateway/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'VERSION'
              - 'scripts/**'
              - 'deploy/collector-agent/**'
              - 'web-ui/frontend/package*.json'
            frontend:
              - 'web-ui/frontend/**'

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret-Scan (gitleaks CLI)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --no-banner --redact

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Version (VERSION = alle Pakete)
        run: python3 scripts/version.py check
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests orchestrator
        run: uv run --package orchestrator pytest orchestrator/tests -q
      - name: Tests collectors
        run: uv run --package collectors pytest collectors/tests -q
      - name: Tests sot-gateway
        run: uv run --package sot-gateway pytest sot-gateway/tests -q
      - name: Agent-Paket (Docker-Stage, Wheels vollstaendig)
        run: docker build --target agent-package -f orchestrator/Dockerfile .

  # Migrationen und Orchestrator-Tests gegen echtes Postgres (wie Dev/Prod); die Python-Jobs
  # oben laufen schnell gegen SQLite.
  postgres:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: automato
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: automato
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U automato"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AUTOMATO_DATABASE_URL: postgresql+psycopg://automato:ci-only@localhost:5432/automato
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Migrationen hoch, ganz runter, wieder hoch
        working-directory: orchestrator
        run: |
          uv run --package orchestrator alembic upgrade head
          uv run --package orchestrator alembic downgrade base
          uv run --package orchestrator alembic upgrade head
      - name: Testdatenbank anlegen
        run: >-
          uv run --package orchestrator python -c "import sqlalchemy as sa;
          e = sa.create_engine('$AUTOMATO_DATABASE_URL', isolation_level='AUTOCOMMIT');
          e.connect().execute(sa.text('CREATE DATABASE automato_test'))"
      - name: Tests orchestrator gegen Postgres
        env:
          AUTOMATO_TEST_DATABASE_URL: postgresql+psycopg://automato:ci-only@localhost:5432/automato_test
        run: uv run --package orchestrator pytest orchestrator/tests -q

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
