# Grundaufbau (Meilenstein M6). Profile:
#   core       -> postgres, redis, orchestrator, web-ui
#   collectors -> Collector-Worker (FortiGate/ACI, liest Beispieldaten bis M7)
# Start: docker compose --profile core --profile collectors up --build
#
# Infoblox DDI (M1-Entscheid) ist ein externes System (Test-/Kundeninstanz) und
# laeuft nicht im Compose; Zugang wird ueber AUTOMATO_-Variablen konfiguriert.
# Wachstumspfad: docker compose -> Kubernetes bei Multi-Worker-Skalierung.

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    environment:
      POSTGRES_DB: automato
      POSTGRES_USER: automato
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automato}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automato -d automato"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTOMATO_ENVIRONMENT: ${AUTOMATO_ENVIRONMENT:-dev}
      AUTOMATO_DATABASE_URL: postgresql+psycopg://automato:${POSTGRES_PASSWORD:-automato}@postgres:5432/automato
      AUTOMATO_REDIS_URL: redis://redis:6379/0
      AUTOMATO_INTERNAL_API_TOKEN: ${AUTOMATO_INTERNAL_API_TOKEN:-dev-only-token}
      AUTOMATO_CORS_ORIGINS: ${AUTOMATO_CORS_ORIGINS:-["http://localhost:5173"]}
      # SoT-Zugang (lesend) fuer das Matching. NetBox laeuft als eigener Stack auf
      # dem Host -> ueber host.docker.internal:<port> erreichbar (siehe lab/README.md).
      AUTOMATO_NETBOX_URL: ${AUTOMATO_NETBOX_URL:-}
      AUTOMATO_NETBOX_TOKEN: ${AUTOMATO_NETBOX_TOKEN:-}
      AUTOMATO_NETBOX_VERIFY_TLS: ${AUTOMATO_NETBOX_VERIFY_TLS:-true}
      # AuthN (E1, ADR 0007): dev = ohne Login (Standard-Admin), oidc = Keycloak-JWT.
      # Ohne Angaben bleibt es bei dev; fuer oidc in .env setzen (deploy/keycloak/PROD-INSTALL.md).
      AUTOMATO_AUTH_MODE: ${AUTOMATO_AUTH_MODE:-dev}
      AUTOMATO_OIDC_ISSUER: ${AUTOMATO_OIDC_ISSUER:-}
      AUTOMATO_OIDC_AUDIENCE: ${AUTOMATO_OIDC_AUDIENCE:-}
      AUTOMATO_OIDC_JWKS_URL: ${AUTOMATO_OIDC_JWKS_URL:-}
      AUTOMATO_OIDC_WEB_CLIENT_ID: ${AUTOMATO_OIDC_WEB_CLIENT_ID:-automato-web}
      AUTOMATO_OIDC_ADMIN_CONSOLE_URL: ${AUTOMATO_OIDC_ADMIN_CONSOLE_URL:-}
      AUTOMATO_OIDC_CLOCK_SKEW_SECONDS: ${AUTOMATO_OIDC_CLOCK_SKEW_SECONDS:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  collector:
    build:
      context: .
      dockerfile: collectors/Dockerfile
    profiles: ["collectors"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AUTOMATO_REDIS_URL: redis://redis:6379/0
      AUTOMATO_ORCHESTRATOR_URL: http://orchestrator:8000
      AUTOMATO_INTERNAL_API_TOKEN: ${AUTOMATO_INTERNAL_API_TOKEN:-dev-only-token}
      # FortiGate-Zugang (read-only!). Leer -> Collector liest Beispieldaten.
      # Die FortiGate-VM ist per LAN-IP direkt erreichbar (kein host.docker.internal noetig).
      AUTOMATO_FORTIGATE_URL: ${AUTOMATO_FORTIGATE_URL:-}
      AUTOMATO_FORTIGATE_TOKEN: ${AUTOMATO_FORTIGATE_TOKEN:-}
      AUTOMATO_FORTIGATE_VERIFY_TLS: ${AUTOMATO_FORTIGATE_VERIFY_TLS:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web-ui:
    build:
      context: web-ui/frontend
    profiles: ["core"]
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
    ports:
      - "5173:5173"
    depends_on:
      - orchestrator

  # TLS-Reverse-Proxy vor der Web-UI (Profil "proxy", optional): https://<AUTOMATO_UI_HOST>
  # (IP oder Name). Zertifikat: AUTOMATO_UI_TLS=internal (Default, selbst erzeugt) oder
  # "<crt> <key>" aus deploy/proxy/pki/ (siehe deploy/proxy/README.md).
  # Start: docker compose --profile core --profile proxy up -d
  proxy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      AUTOMATO_UI_HOST: ${AUTOMATO_UI_HOST:-localhost}
      AUTOMATO_UI_TLS: ${AUTOMATO_UI_TLS:-internal}
    ports:
      - "443:443"
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/proxy/pki:/etc/caddy/pki:ro
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      - web-ui

  # AuthN/RBAC-IdP (E1, ADR 0007). Eigenes Profil "auth" -> beeinflusst core/collectors
  # nicht. Importiert den Realm "automato" (Rollen viewer/operator/admin, Clients
  # automato-web [PKCE]/automato-api, tenant_ids-Mapper, geseedter Admin mit OTP-Pflicht).
  # Produktiv: eigener Container -> eigene VM, eigene URL, TLS/Proxy davor (siehe
  # deploy/keycloak/README.md). Orchestrator koppeln via AUTOMATO_AUTH_MODE=oidc.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["auth"]
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Realm-Haertung (Brute-Force, Passwort-Policy, OTP, Security-Header) steckt im
      # importierten Realm; Health-Endpoint fuers Monitoring aktiviert (Port 9000).
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Realm-Import (read-only) ...
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
      # ... und persistente Daten (H2), damit lokal angelegte User/OTP einen Neustart
      # ueberleben. Der Import-Bind liegt als Sub-Mount darueber.
      - keycloak-data:/opt/keycloak/data
    ports:
      # Nur lokal; produktiv NICHT direkt veroeffentlichen (TLS/Proxy davor, s. Playbook).
      - "127.0.0.1:8081:8081"

volumes:
  postgres-data:
  keycloak-data:
  proxy-data:
  proxy-config:
