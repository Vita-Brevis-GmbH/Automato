# Start-Setup (Grundaufbau, Meilenstein M6). Wird schrittweise um die weiteren Services ergänzt.
# Wachstumspfad: docker-compose -> Kubernetes bei Multi-Worker-Skalierung (ROADMAP.md, Ausblick).

version: "3.9"

services:
  netbox:
    image: netboxcommunity/netbox:latest
    # Platzhalter - vollständige NetBox-Config (Postgres, Redis) folgt in source-of-truth/
    profiles: ["sot"]

  orchestrator:
    build: ./orchestrator
    profiles: ["core"]

  documentation-engine:
    build: ./documentation-engine
    profiles: ["core"]

  web-ui:
    build: ./web-ui
    profiles: ["core"]
