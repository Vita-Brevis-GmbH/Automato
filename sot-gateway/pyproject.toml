[project]
name = "sot-gateway"
version = "0.9.0"
description = "SoT Gateway - Adapter-Package fuer IPAM/Source-of-Truth-Tools (ADR 0002)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sot_gateway"]
