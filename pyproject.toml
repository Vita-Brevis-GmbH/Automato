[project]
name = "automato"
version = "0.1.0"
description = "Automatisierungsplattform - Monorepo-Workspace (siehe README.md)"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["orchestrator", "collectors", "sot-gateway"]

[tool.uv.sources]
sot-gateway = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["orchestrator/alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit (Security)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert in Tests ist erwuenscht

[tool.ruff.lint.flake8-bugbear]
# FastAPI-Idiom: Depends()/Header() als Default-Argument ist gewollt
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
