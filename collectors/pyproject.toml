[project]
name = "collectors"
version = "0.1.0"
description = "Automato Collectors - read-only Erfassung von Firewall-Regeln (UC1)"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collectors"]
