[project]
name = "collectors"
version = "0.108.0"
description = "Automato Collectors - read-only Erfassung von Firewall-Regeln (UC1)"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Signaturpruefung der Agent-Updates (Ed25519) und mTLS-Hilfen
    "cryptography>=42",
    # Infoblox-/NetBox-Leser fuer Referenzquellen (ADR 0010), lokal als Wheel im Agent-Paket
    "sot-gateway",
    "pyvmomi>=8.0",
    "paramiko>=3.4",
    "textfsm>=1.1.3",
    "ntc-templates>=5.0",
    # Switches & Router ueber SNMPv3 (ADR 0033): nur GET/GETBULK, authPriv; erst beim Lesen geladen
    "pysnmp>=7.1",
]

# Externer Standalone-Collector (ADR 0008): laeuft ohne Celery/Redis, nur ausgehend HTTPS.
[project.scripts]
automato-collector = "collectors.run:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collectors"]
